                      username: "john.doe"
                      email: "john.doe@warmhome.com"
                      first_name: "John"
                      last_name: "Doe"
                      role: "user"
                      created_at: "2024-01-15T10:30:00Z"
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  summary: Validation Error
                  description: Example of validation error response
                  value:
                    error: "Invalid input data"
                    code: "VALIDATION_ERROR"
                    details:
                      field: "username"
                      reason: "Username is required"
                      value: ""
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_credentials:
                  summary: Invalid Credentials
                  description: Example response when credentials are invalid
                  value:
                    error: "Invalid username or password"
                    code: "INVALID_CREDENTIALS"
                    details:
                      field: "credentials"
                      reason: "Username or password is incorrect"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      summary: Refresh Token
      description: Refresh JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              refresh_token:
                summary: Refresh Token
                description: Example of refreshing JWT token
                value:
                  refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                token_refreshed:
                  summary: Token Refreshed
                  description: Example response when token is refreshed successfully
                  value:
                    access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                    refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                    expires_in: 3600
                    token_type: "Bearer"
                    user:
                      id: 1
                      username: "john.doe"
                      email: "john.doe@warmhome.com"
                      first_name: "John"
                      last_name: "Doe"
                      role: "user"
                      created_at: "2024-01-15T10:30:00Z"
        '400':
          description: Bad request - invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_refresh_token:
                  summary: Invalid Refresh Token
                  description: Example response when refresh token is invalid
                  value:
                    error: "Invalid refresh token"
                    code: "INVALID_REFRESH_TOKEN"
                    details:
                      field: "refresh_token"
                      reason: "Refresh token is malformed or invalid"
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized - expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired_refresh_token:
                  summary: Expired Refresh Token
                  description: Example response when refresh token has expired
                  value:
                    error: "Refresh token expired"
                    code: "REFRESH_TOKEN_EXPIRED"
                    details:
                      field: "refresh_token"
                      reason: "Refresh token has expired, user must login again"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

  /auth/logout:
    post:
      summary: User Logout
      description: Invalidate JWT token
      tags:
        - Authentication
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
              examples:
                logout_success:
                  summary: Logout Success
                  description: Example response when logout is successful
                  value:
                    message: "Logout successful"
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid Token
                  description: Example response when token is invalid
                  value:
                    error: "Invalid or expired token"
                    code: "INVALID_TOKEN"
                    details:
                      field: "authorization"
                      reason: "JWT token is invalid or has expired"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

  /auth/profile:
