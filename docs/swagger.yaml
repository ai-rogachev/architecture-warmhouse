openapi: 3.0.3
info:
  title: WarmHome Smart Home API
  description: |
    Comprehensive API for WarmHome Smart Home Ecosystem
    This API provides endpoints for all major services including monitoring, device management, automation, and security.
  version: 1.0.0
  contact:
    name: WarmHome API Support
    email: api@warmhome.com

servers:
  - url: https://api.warmhome.com/v1
    description: Production server
  - url: https://staging-api.warmhome.com/v1
    description: Staging server
  - url: http://localhost:8080/api/v1
    description: Local development server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # Monitoring System - Timeseries Service
  /monitoring/timeseries:
    get:
      summary: Get Timeseries Data
      description: Retrieve timeseries data for sensors and devices
      tags:
        - Monitoring
      parameters:
        - name: sensor_id
          in: query
          description: Filter by sensor ID
          schema:
            type: integer
          example: 5
        - name: start_time
          in: query
          description: Start time for data range
          schema:
            type: string
            format: date-time
          example: "2024-01-15T00:00:00Z"
        - name: end_time
          in: query
          description: End time for data range
          schema:
            type: string
            format: date-time
          example: "2024-01-15T23:59:59Z"
        - name: limit
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            default: 100
          example: 50
      responses:
        '200':
          description: Timeseries data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeseriesData'
              examples:
                temperature_data:
                  summary: Temperature Data
                  description: Example response with temperature sensor data
                  value:
                    - id: 1
                      sensor_id: 5
                      value: 22.5
                      unit: "°C"
                      timestamp: "2024-01-15T10:30:00Z"
                      metadata:
                        humidity: 45.2
                        battery_level: 85
                        signal_strength: "strong"
                    - id: 2
                      sensor_id: 5
                      value: 22.3
                      unit: "°C"
                      timestamp: "2024-01-15T10:25:00Z"
                      metadata:
                        humidity: 45.5
                        battery_level: 85
                        signal_strength: "strong"
                    - id: 3
                      sensor_id: 5
                      value: 22.7
                      unit: "°C"
                      timestamp: "2024-01-15T10:20:00Z"
                      metadata:
                        humidity: 44.8
                        battery_level: 85
                        signal_strength: "strong"
                humidity_data:
                  summary: Humidity Data
                  description: Example response with humidity sensor data
                  value:
                    - id: 4
                      sensor_id: 6
                      value: 45.2
                      unit: "%"
                      timestamp: "2024-01-15T10:30:00Z"
                      metadata:
                        temperature: 22.5
                        pressure: 1013.25
                        battery_level: 90
                    - id: 5
                      sensor_id: 6
                      value: 45.0
                      unit: "%"
                      timestamp: "2024-01-15T10:25:00Z"
                      metadata:
                        temperature: 22.3
                        pressure: 1013.20
                        battery_level: 90
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_parameters:
                  summary: Invalid Parameters
                  description: Example response when query parameters are invalid
                  value:
                    error: "Invalid parameters"
                    code: "INVALID_PARAMETERS"
                    details:
                      field: "start_time"
                      reason: "Invalid date format. Use ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ)"
                      value: "invalid-date"
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Unauthorized
                  description: Example response when authentication is required
                  value:
                    error: "Authentication required"
                    code: "UNAUTHORIZED"
                    details:
                      field: "authorization"
                      reason: "Valid JWT token is required"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

    post:
      summary: Create Timeseries Data
      description: Create new timeseries data point
      tags:
        - Monitoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeseriesDataCreate'
            examples:
              temperature_reading:
                summary: Temperature Reading
                description: Example of creating a temperature sensor reading
                value:
                  sensor_id: 5
                  value: 22.5
                  unit: "°C"
                  timestamp: "2024-01-15T10:30:00Z"
                  metadata:
                    humidity: 45.2
                    battery_level: 85
              humidity_reading:
                summary: Humidity Reading
                description: Example of creating a humidity sensor reading
                value:
                  sensor_id: 6
                  value: 45.2
                  unit: "%"
                  timestamp: "2024-01-15T10:30:00Z"
                  metadata:
                    temperature: 22.5
                    pressure: 1013.25
      responses:
        '201':
          description: Timeseries data created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesData'
              examples:
                success_response:
                  summary: Successful Creation
                  description: Example response when timeseries data is created
                  value:
                    id: 1
                    sensor_id: 5
                    value: 22.5
                    unit: "°C"
                    timestamp: "2024-01-15T10:30:00Z"
                    metadata:
                      humidity: 45.2
                      battery_level: 85
                      signal_strength: "strong"
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  summary: Validation Error
                  description: Example response when validation fails
                  value:
                    error: "Invalid input data"
                    code: "VALIDATION_ERROR"
                    details:
                      field: "sensor_id"
                      reason: "Sensor ID is required"
                      value: null
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Unauthorized
                  description: Example response when authentication is required
                  value:
                    error: "Authentication required"
                    code: "UNAUTHORIZED"
                    details:
                      field: "authorization"
                      reason: "Valid JWT token is required"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

  /monitoring/timeseries/{id}:
    get:
      summary: Get Timeseries Data by ID
      description: Retrieve specific timeseries data point
      tags:
        - Monitoring
      parameters:
        - name: id
          in: path
          required: true
          description: Timeseries data ID
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Timeseries data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesData'
              examples:
                timeseries_found:
                  summary: Timeseries Data Found
                  description: Example response when timeseries data is retrieved successfully
                  value:
                    id: 1
                    sensor_id: 5
                    value: 22.5
                    unit: "°C"
                    timestamp: "2024-01-15T10:30:00Z"
                    metadata:
                      humidity: 45.2
                      battery_level: 85
                      signal_strength: "strong"
        '404':
          description: Timeseries data not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                timeseries_not_found:
                  summary: Timeseries Data Not Found
                  description: Example response when timeseries data is not found
                  value:
                    error: "Timeseries data not found"
                    code: "TIMESERIES_NOT_FOUND"
                    details:
                      field: "id"
                      reason: "Timeseries data with specified ID does not exist"
                      value: 999
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

    delete:
      summary: Delete Timeseries Data
      description: Delete specific timeseries data point
      tags:
        - Monitoring
      parameters:
        - name: id
          in: path
          required: true
          description: Timeseries data ID
          schema:
            type: integer
          example: 1
      responses:
        '204':
          description: Timeseries data deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Timeseries data deleted successfully"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
              examples:
                deletion_success:
                  summary: Deletion Success
                  description: Example response when timeseries data is deleted successfully
                  value:
                    message: "Timeseries data deleted successfully"
                    timestamp: "2024-01-15T10:30:00Z"
        '404':
          description: Timeseries data not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                timeseries_not_found:
                  summary: Timeseries Data Not Found
                  description: Example response when timeseries data is not found
                  value:
                    error: "Timeseries data not found"
                    code: "TIMESERIES_NOT_FOUND"
                    details:
                      field: "id"
                      reason: "Timeseries data with specified ID does not exist"
                      value: 999
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

  # Device Management System
  /devices:
    get:
      summary: Get All Devices
      description: Retrieve all registered devices
      tags:
        - Device Management
      parameters:
        - name: type
          in: query
          description: Filter by device type
          schema:
            type: string
          example: "temperature"
        - name: status
          in: query
          description: Filter by device status
          schema:
            type: string
          example: "online"
        - name: location
          in: query
          description: Filter by device location
          schema:
            type: string
          example: "Living Room"
      responses:
        '200':
          description: Devices retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              examples:
                devices_list:
                  summary: Devices List
                  description: Example response with list of devices
                  value:
                    - id: 1
                      name: "Living Room Temperature Sensor"
                      type: "temperature"
                      model: "DHT22"
                      location: "Living Room"
                      status: "online"
                      ip_address: "192.168.1.100"
                      mac_address: "AA:BB:CC:DD:EE:FF"
                      created_at: "2024-01-15T10:30:00Z"
                      updated_at: "2024-01-15T10:30:00Z"
                    - id: 2
                      name: "Kitchen Light"
                      type: "lighting"
                      model: "Philips Hue"
                      location: "Kitchen"
                      status: "online"
                      ip_address: "192.168.1.101"
                      mac_address: "BB:CC:DD:EE:FF:00"
                      created_at: "2024-01-15T10:30:00Z"
                      updated_at: "2024-01-15T10:30:00Z"
                    - id: 3
                      name: "Front Door Motion Sensor"
                      type: "motion"
                      model: "PIR-001"
                      location: "Front Door"
                      status: "offline"
                      ip_address: "192.168.1.102"
                      mac_address: "CC:DD:EE:FF:00:11"
                      created_at: "2024-01-15T10:30:00Z"
                      updated_at: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Unauthorized
                  description: Example response when authentication is required
                  value:
                    error: "Authentication required"
                    code: "UNAUTHORIZED"
                    details:
                      field: "authorization"
                      reason: "Valid JWT token is required"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

    post:
      summary: Create New Device
      description: Register a new device in the system
      tags:
        - Device Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
            examples:
              temperature_sensor:
                summary: Temperature Sensor
                description: Example of creating a temperature sensor
                value:
                  name: "Kitchen Temperature Sensor"
                  type: "temperature"
                  location: "Kitchen"
                  model: "DHT22"
                  ip_address: "192.168.1.101"
                  mac_address: "AA:BB:CC:DD:EE:FF"
              motion_sensor:
                summary: Motion Sensor
                description: Example of creating a motion sensor
                value:
                  name: "Front Door Motion Sensor"
                  type: "motion"
                  location: "Front Door"
                  model: "PIR-001"
                  ip_address: "192.168.1.102"
                  mac_address: "BB:CC:DD:EE:FF:00"
              smart_light:
                summary: Smart Light
                description: Example of creating a smart light
                value:
                  name: "Living Room Light"
                  type: "lighting"
                  location: "Living Room"
                  model: "Philips Hue"
                  ip_address: "192.168.1.103"
                  mac_address: "CC:DD:EE:FF:00:11"
      responses:
        '201':
          description: Device created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                success_response:
                  summary: Successful Device Creation
                  description: Example response when device is created
                  value:
                    id: 1
                    name: "Kitchen Temperature Sensor"
                    type: "temperature"
                    model: "DHT22"
                    location: "Kitchen"
                    status: "online"
                    ip_address: "192.168.1.101"
                    mac_address: "AA:BB:CC:DD:EE:FF"
                    created_at: "2024-01-15T10:30:00Z"
                    updated_at: "2024-01-15T10:30:00Z"
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  summary: Validation Error
                  description: Example response when validation fails
                  value:
                    error: "Invalid input data"
                    code: "VALIDATION_ERROR"
                    details:
                      field: "name"
                      reason: "Device name is required"
                      value: ""
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Unauthorized
                  description: Example response when authentication is required
                  value:
                    error: "Authentication required"
                    code: "UNAUTHORIZED"
                    details:
                      field: "authorization"
                      reason: "Valid JWT token is required"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Server Error
                  description: Example response when server error occurs
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_SERVER_ERROR"
                    details:
                      field: "system"
                      reason: "Database connection failed"
                    timestamp: "2024-01-15T10:30:00Z"

  /devices/{id}:
    get:
      summary: Get Device by ID
      description: Retrieve specific device information
      tags:
        - Device Management
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Device retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                device_found:
                  summary: Device Found
                  description: Example response when device is retrieved successfully
                  value:
                    id: 1
                    name: "Living Room Temperature Sensor"
                    type: "temperature"
                    model: "DHT22"
                    location: "Living Room"
                    status: "online"
                    ip_address: "192.168.1.100"
                    mac_address: "AA:BB:CC:DD:EE:FF"
                    created_at: "2024-01-15T10:30:00Z"
                    updated_at: "2024-01-15T10:30:00Z"
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                device_not_found:
                  summary: Device Not Found
                  description: Example response when device is not found
                  value:
                    error: "Device not found"
                    code: "DEVICE_NOT_FOUND"
