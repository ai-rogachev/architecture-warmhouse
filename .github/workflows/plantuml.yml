name: PlantUML Diagrams

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    container: plantuml/plantuml:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Diagrams
      run: |
        echo "Checking PlantUML installation..."
        which plantuml || echo "plantuml not found in PATH"
        ls -la /usr/local/bin/ | grep plantuml || echo "No plantuml in /usr/local/bin/"
        ls -la /usr/bin/ | grep plantuml || echo "No plantuml in /usr/bin/"
        echo "Available commands:"
        ls -la /usr/local/bin/ | head -10
        echo "Trying java -jar approach..."
        find / -name "plantuml*.jar" 2>/dev/null | head -5 || echo "No plantuml jar found"
        
        for dir in diagrams/context diagrams/container diagrams/component diagrams/code diagrams/ER; do
          if [ -d "$dir" ]; then
            for file in "$dir"/*.puml; do
              if [ -f "$file" ]; then
                echo "Processing: $file"
                java -jar /usr/local/bin/plantuml.jar -tpng "$file" || plantuml -tpng "$file"
              fi
            done
          fi
        done

    - name: Commit Diagrams
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add diagrams/**/*.png
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated diagram generation"
          git push origin ${{ github.ref_name }}
        fi
      if: success()